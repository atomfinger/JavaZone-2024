name: Main build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Docker Info
        run: docker info

      - name: Docker PS
        run: docker ps -a

      - name: Docker System DF
        run: docker system df

      - name: Pull Kafka Image
        run: docker pull confluentinc/cp-kafka:7.5.3

      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test --info

